name: Risk Guard

on:
  push:

permissions:
  contents: read
  actions: read # let upload-sarif read workflow-run info for fingerprinting
  security-events: write # upload SARIF to the Security tab

jobs:
  risk-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Risk-Guard/action@v1
